name: Bug report
description: Report an app problem using redacted or synthetic details.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This report will be public. Do not include bank messages, receipts, account/card numbers, email addresses, transaction references or backups. For a security vulnerability, use the private reporting link instead.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.5.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      description: Do not include device serial numbers or account information.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain what you expected and what you saw, using synthetic details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include whether you switched apps, locked the phone or updated the app.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal and financial information from this report and any attachments.
          required: true
